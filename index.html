dth:100%;padding:14px 12px;border-radius:8px;background:linear-gradient(90deg,#16845f,#20a477);border:1px solid #48d5a4;color:white;font-weight:800;cursor:pointer}.green:hover{filter:brightness(1.15)}.hint{font-size:11px;color:#a9c9dd;margin-top:10px}.back{border:1px solid #51769e;background:#1b3c61;color:white;border-radius:8px;padding:10px 14px;cursor:pointer;margin-bottom:14px}.pre{font-size:16px;line-height:1.7;white-space:pre-wrap;background:#102440;border-left:4px solid #4b9bea;border-radius:10px;padding:20px;overflow-wrap:anywhere}.pre strong{color:#fff}.note{color:#b5cce7;font-size:12px;line-height:1.6}@media(max-width:650px){main{padding:15px 12px}.layout{grid-template-columns:1fr}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.menu button{font-size:12px;padding:10px}.content{padding:15px;min-height:0}h1{font-size:22px}}
</style></head><body><main><div class="top"><h1>Callback Script</h1><span class="sub">• Separate reference</span></div><p class="intro">Use this section for callbacks when the lead’s details may not yet be available. Choose a program to view its script and screening requirements. This is a reference script; it does not collect or save lead information.</p><div class="layout"><nav id="menu" class="menu" aria-label="Callback programs"></nav><section id="content" class="content" aria-live="polite"></section></div></main><script>
'use strict';
const programScripts={"debt": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject “BENEFITS ENCLOSED.” I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, you mentioned having $[debt amount] in debt and making monthly payments of at least $250. I understand how challenging it can be to manage those payments while trying to cover your family’s everyday needs.\n\nThe good news is that there may be a debt assistance program worth exploring that could help reduce your monthly payments, depending on your eligibility. This could potentially free up more money for other important household expenses.\n\nI can connect you directly with a debt program specialist who can review your options, explain how the program works, and help you determine whether it’s a good fit for your situation. Afterward, I’ll follow up with you to make sure you’ve received your benefits email and see if you need any further assistance.\n\nWould it be alright if I placed you on a brief hold while I connect you with the specialist?", "aca": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from **info@helpinghandsact.com** with the subject **“BENEFITS ENCLOSED.”** I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, given your current financial situation, I also want to help you explore ways to protect yourself and your family from unexpected medical expenses. The good news is that, depending on your income and eligibility, you may qualify for affordable health coverage through the Affordable Care Act, with benefits that can include preventive checkups, screenings, prescription medications, and vaccines.\n\nOkay, great! It looks like you may qualify for multiple ACA plans based on your zip code. I would like to transfer you to a licensed Insurance Agent who can review your plan options.\n\nDo I have your permission to transfer you now to a licensed insurance agent?\n\n**REQUIRED TO GET A YES**\n\nAlright I'm bringing them on the line now, they'll be a big help and let you know what you may qualify for. Please stay on the line with me.", "tax": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject “BENEFITS ENCLOSED.” I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nYou also mentioned having tax debts, and I understand how stressful that can be, especially during financial hardship. There may be another program that could help you with this tax debts. You may be eligible for possible tax deductions, credits, refunds, or exemptions that you may have missed. This can definitely help you with your current financial situation.\n\nI can connect you with a senior agent who can explain the program and check your eligibility. Would it be okay to place you on a brief hold while I transfer your call?", "mva": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject “BENEFITS ENCLOSED.” I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, based on the information you shared about your recent motor vehicle accident, I’d also like to help you explore another potential source of support. I can connect you with a specialist who can explain your options for legal representation and help determine whether you may be eligible to pursue a claim.\n\nIf you qualify, compensation from a claim may help ease some of the financial pressure you’re experiencing, depending on your circumstances and the outcome of the claim.\n\nWould it be okay if I placed you on a brief hold while I connect you with the specialist to discuss your options and check your eligibility?", "internet": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject “BENEFITS ENCLOSED.” I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, I’d also like to help you explore ways to reduce your monthly expenses. Based on your current financial situation, you may qualify for special discounts on high-speed internet service. If eligible, this could help lower your monthly internet bill and free up more money for other essential expenses.\n\nI can connect you with a specialist for a free consultation to review your options and see what savings may be available to you.\n\nWould it be okay if I placed you on a brief hold while I connect you with the specialist?", "medsupp": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from **info@helpinghandsact.com** with the subject **“BENEFITS ENCLOSED.”** I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, given your current financial situation, I also want to help you explore ways to protect yourself and take advantage of the expanded health care benefits which includes doctor flexibility and can act as your financial shield from massive medical bills when you get sick.\n\nIt looks like you may qualify for Medical Supplement Plan based on your zip code. I would like to transfer you to a licensed Insurance Agent who can review your plan options.\n\nDo I have your permission to transfer you now to a licensed insurance agent?\n\n**REQUIRED TO GET A YES**\n\nAlright I'm bringing them on the line now, they'll be a big help and let you know what you may qualify for. Please stay on the line with me.\n\nTo the specialist: Hi. I have [lead's name] on the line and she is interested with the Medicare Supplement program.. can you take it from here.", "medicare": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from **info@helpinghandsact.com** with the subject **“BENEFITS ENCLOSED.”** I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, given your current financial situation, I also want to help you explore ways to protect yourself and take advantage of the expanded health care benefits on Medicare for 2027 that can you access to more dental, vision, and hearing aid coverage, grocery or healthy food allowances, over the counter product credits, transportation to medical appointments, lower prescription cost and reduced co-pays.\n\nOkay, great! It looks like you may qualify for additional Medicare benefits based on your zip code. I would like to transfer you to a licensed Insurance Agent who can review your plan options.\n\nDo I have your permission to transfer you now to a licensed insurance agent?\n\n**REQUIRED TO GET A YES**\n\nAlright I'm bringing them on the line now, they'll be a big help and let you know what you may qualify for. Please stay on the line with me.", "ssdi": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject “BENEFITS ENCLOSED.” I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, I’d also like to help you explore whether you may qualify for disability benefits. Depending on your circumstances and eligibility, you could potentially receive up to $2,600 per month in benefits, which may provide additional financial support for your everyday needs.\n\nI can connect you with a disability claims specialist who can explain the available options, review your eligibility, and guide you through the next steps.\n\nWould it be okay if I placed you on a brief hold while I connect you with the specialist?", "edu": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject “BENEFITS ENCLOSED.” I’m your case manager, and I’ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, since you mentioned your willingness to go back to school to improve your income, I will transfer you to the Education team who can walk you through the program and what opportunities you qualify for.\n\nWould it be ok if I placed you on a brief hold while I connect you to the education team?", "end": "I’m so sorry, but at this time based on your answers you do not qualify for additional support other than your programs provided on the website. I encourage you to continue to visit the Helping Hands site and I will stay in touch with you when new programs become available to you by text, email or phone. Have a wonderful Day, Bye.", "loan": "There may be a personal loan option available. I can connect you with a specialist who can review program terms and whether you qualify. Would you like me to connect you?", "slc": "I have good news for you! Your application for hardship support has been accepted. Please keep an eye out for an email from info@helpinghandsact.com with the subject \u201cBENEFITS ENCLOSED.\u201d I\u2019m your case manager, and I\u2019ll stay in touch to help ensure you receive the support you need.\n\nIn the meantime, since you mentioned you have [amount] in federal student loans, I understand how challenging it can be to manage those payments while trying to cover your everyday needs. Based on your current situation, there may be federal repayment options that could help with these student loans.\n\nWould it be okay if I placed you on a brief hold while I connect you for a free consultation with the student loan specialist so they can explain your options?"};
const programNames={"debt": "Debt", "tax": "Tax", "aca": "ACA", "medsupp": "Med Supp", "medicare": "Medicare", "ssdi": "SSDI", "mva": "Motor Vehicle Accident", "internet": "Internet Service", "edu": "Education", "loan": "Personal Loans", "slc": "Student Loans (SLC)"};
const callbackScripts = {
  overview: {title:'Opening and reason for callback', body:[
    ['Greeting','Hi ! My name is ( agent name) from Helping Hands. Am I speaking with ( lead’s name)'],
    ['Rapport','Hi ( Lead’s name) . How are you today?'],
    ['Callback purpose','I am just doing a follow up on your inquiry about the hardship assistance programs. I am calling to inform you that the benefits team is actively seeking for more programs that we can send your way to help you with your utility bills, rent and other financial issues. Also, based on your zip code, which is (____) , is this correct?'],
    ['Transition','Perfect, based on your zipcode, you may qualify for:']
  ]},
  medicareaca:{title:'ACA', body:[
    ['Program introduction','Expanded health and medical coverage that will ensure you and your family’s safety during unexpected health emergencies.'],
    ['Screening','I just need to confirm:'],
    ['Question','Do you currently have Medicaid, Medicare, Tri-Care, Medi-Cal, VA benefits, employer-provided health insurance, or private insurance?'],
    ['Eligibility requirement','MUST BE NONE TO QUALIFY']
  ]},
  medicare:{title:'Medicare', body:[
    ['Program introduction','Expanded health and medical coverage that will ensure you and your family’s safety during unexpected health emergencies.'],
    ['Screening question','Do you have Medicare Parts A and B?'],
    ['Eligibility requirement','Must be YES.'],
    ['Next step','Proceed to Pretransfer script if the requirement is met.']
  ]},
  debt:{title:'Debt', body:[
    ['Program introduction','Consolidation and reduction to a fraction of the cost on what you are currently paying towards your unsecured debts. I just need to confirm:'],
    ['Question 1','How much total credit card and unsecured loans are you struggling to pay?'],
    ['Question 2','Are you currently paying at least $250 monthly towards these debts?'],
    ['Eligibility requirement','Must be YES. Proceed to pretransfer script if the requirement is met.']
  ]},
  tax:{title:'Tax', body:[
    ['Program introduction','Tax relief program that can put you and your family at ease. I just need to confirm:'],
    ['Question 1','Do you have any outstanding Tax debts to your state or to the IRS of at least $8K or more?'],
    ['Requirement 1','Must be YES.'],
    ['Question 2','Are you currently employed?'],
    ['Requirement 2','Must be YES. Proceed to pretransfer script if the requirements are met.']
  ]},
  internet:{title:'Internet', body:[
    ['Program introduction','Discounted rates on your utility bills including your bills for high speed internet service. I just need to confirm:'],
    ['Screening question','Are you in-charge of paying your home utility bills?'],
    ['Eligibility requirement','Must be YES. Proceed with pretransfer script if the requirement is met.']
  ]},
  ssdi:{title:'SSDI', body:[
    ['Program introduction','Disability claim of up to $3000. I just need to confirm:'],
    ['Question 1','Are you currently employed?'],['Requirement 1','Must not be employed or just part time employed.'],
    ['Question 2','If part time: How much do you make in a month?'],['Requirement 2','Must not be more than $1500.'],
    ['Question 3','Are you limited from working due to disability or injury?'],['Requirement 3','Must be YES.'],
    ['Question 4','Do you have any pending disability application?'],['Requirement 4','Must not have a pending application.'],
    ['Question 5','Do you have any on-going treatments such as hospital visits or are you on medications for your disability?'],['Requirement 5','Must be YES. Proceed to pretransfer script if all requirements are met.']
  ]},
  mva:{title:'MVA', body:[
    ['Program introduction','Legal representation if you had recent motor vehicle accident.'],
    ['Screening question','Have you been in a motor vehicle accident recently?'],
    ['Eligibility requirement','Must be YES. Proceed to pre transfer script if the requirement is met.']
  ]},
  edu:{title:'Education (EDU)', body:[
    ['Program introduction','Grants so you can enroll in school to improve your current situation and income. I just need to confirm:'],
    ['Question 1','This ( address on file) is your current address, correct?'],
    ['Question 2','Can you pls confirm your age?'],['Requirement 2','Must not be over 63.'],
    ['Question 3','Are you currently on Medicaid?'],['Requirement 3','Must not be under Medicaid.'],
    ['Question 4','Do you currently have a working computer at home?'],['Requirement 4','Must have computer.'],
    ['Question 5','Do you have a High school Diploma or GED?'],['Requirement 5','Must be YES. Proceed with pre transfer script.'],
    ['Question 6','Are you currently enrolled right now?'],['Requirement 6','Must be NO.']
  ]},
  slc:{title:'Student Loan Consolidation (SLC)', body:[
    ['Program introduction','Huge reduction on your current federal student loan debt payments. I just need to confirm:'],
    ['Question 1','Do you have at least $10K in Federal student loans?'],['Requirement 1','Must be $10K or more.'],
    ['Question 2','Are you currently enrolled in school?'],['Requirement 2','Must not be enrolled. Proceed to pretransfer script if the requirements are met.']
  ]}
};
const mapping={medicareaca:'aca',medicare:'medicare',debt:'debt',tax:'tax',internet:'internet',ssdi:'ssdi',mva:'mva',edu:'edu',slc:'slc'};
const menu=document.getElementById('menu'),content=document.getElementById('content');let current='overview';
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function boldScript(node,script){const parts=String(script).split(/(\*\*[^*]+\*\*)/g);for(const p of parts){if(p.startsWith('**')&&p.endsWith('**'))node.append(el('strong','',p.slice(2,-2)));else node.append(document.createTextNode(p))}}
function render(key){current=key;menu.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.key===key));const item=callbackScripts[key];content.replaceChildren(el('h2','',item.title));for(const [label,copy] of item.body){const rule=/requirement/i.test(label);const box=el('div','screening'+(rule?' rulebox':''));box.append(el('strong','',label),el('span',rule?'rule':'',copy));content.append(box)}const program=mapping[key];if(program){const action=el('div','action');action.append(el('h3','','Qualified and ready to proceed?'),el('p','','After confirming every required screening answer and the applicable program rules, open the matching pre-transfer script. This will not change or advance the main call flow.'));const btn=el('button','green','✓ Open '+(programNames[program]||program)+' Pre-Transfer Script');btn.type='button';btn.addEventListener('click',()=>showPretransfer(program));action.append(btn,el('div','hint','Agent action • Click only after eligibility is confirmed.'));content.append(action)}}
function showPretransfer(program){content.replaceChildren();const back=el('button','back','← Back to '+callbackScripts[current].title);back.type='button';back.addEventListener('click',()=>render(current));content.append(back,el('h2','',(programNames[program]||program)+' Pre-Transfer Script'));const script=el('div','pre');boldScript(script,programScripts[program]||'');content.append(script,el('p','note','Agent reference only. Confirm eligibility and any required approval before reading statements about acceptance or benefits.'));content.scrollIntoView({behavior:'smooth',block:'start'})}
for(const [key,item] of Object.entries(callbackScripts)){const btn=el('button','',item.title);btn.type='button';btn.dataset.key=key;btn.addEventListener('click',()=>render(key));menu.append(btn)}render('medicareaca');
</script></body></html>
